<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置をあてます！</title>
    <!-- Three.js (3Dアース描画用軽量ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tailwind CSS (スタイリング) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .content-layer {
            position: relative;
            z-index: 10;
        }

        .btn-action {
            background: linear-gradient(135deg, #0052cc 0%, #0066ff 100%);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 102, 255, 0.5);
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #0066ff;
            transform: scale(1.02);
        }

        .glass-panel {
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative">

    <!-- 3D Earth Background -->
    <div id="canvas-container"></div>

    <!-- Main Content Layer -->
    <main class="content-layer w-full max-w-4xl px-6 py-12 flex-1 flex flex-col justify-center items-center">
        
        <!-- Screen 1: Title Screen (No Header / No Tabs) -->
        <div id="screen-start" class="text-center space-y-8 w-full max-w-2xl">
            <div class="space-y-4">
                <p class="text-blue-500 font-bold tracking-widest text-sm uppercase">Location Finder</p>
                <h1 class="text-5xl md:text-7xl font-black tracking-tight leading-tight text-white">
                    位置をあてます！
                </h1>
                <p class="text-gray-400 text-lg md:text-xl font-medium pt-2">
                    IP情報と10個の簡単な質問から、あなたの現在地（市区町村）を正確に特定します。
                </p>
            </div>

            <div class="pt-6">
                <button onclick="startDiagnosis()" class="btn-action text-white text-xl font-bold px-12 py-5 rounded-full tracking-wider shadow-2xl">
                    判定をスタートする
                </button>
            </div>
        </div>

        <!-- Screen 2: Question Screen (10 Questions) -->
        <div id="screen-question" class="hidden w-full max-w-2xl glass-panel p-8 md:p-12 rounded-3xl space-y-8 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <span class="text-blue-400 font-bold tracking-wider text-sm uppercase" id="question-number">QUESTION 01 / 10</span>
                <span class="text-xs text-gray-500 font-mono" id="accuracy-rate">精度: 99.4%</span>
            </div>

            <div class="space-y-4 py-4">
                <h2 id="question-text" class="text-2xl md:text-3xl font-bold leading-snug">
                    質問を読み込み中...
                </h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4" id="options-container">
                <!-- Dynamic Buttons -->
            </div>
        </div>

        <!-- Screen 3: Result Screen -->
        <div id="screen-result" class="hidden w-full max-w-2xl glass-panel p-8 md:p-12 rounded-3xl text-center space-y-8 shadow-2xl">
            <div class="space-y-2">
                <span class="text-blue-400 font-bold tracking-wider text-xs uppercase">IDENTIFIED LOCATION</span>
                <h3 class="text-gray-400 text-lg">あなたが今いる場所（市区町村）は…</h3>
            </div>

            <div class="py-6 border-y border-gray-800">
                <div id="result-city" class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-200 py-2">
                    ---
                </div>
                <div id="result-pref" class="text-sm text-gray-400 mt-2 font-medium">
                    ---
                </div>
            </div>

            <!-- Verification section -->
            <div id="verification-section" class="space-y-4">
                <p class="text-sm text-gray-300">当たっていますか？</p>
                <div class="flex justify-center gap-4">
                    <button onclick="confirmResult(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-full text-sm transition">
                        当たっている！
                    </button>
                    <button onclick="confirmResult(false)" class="bg-rose-700 hover:bg-rose-600 text-white font-bold px-8 py-3 rounded-full text-sm transition">
                        違っている
                    </button>
                </div>
            </div>

            <!-- Correction Section (Shown if incorrect) -->
            <div id="correction-section" class="hidden space-y-4 pt-4 border-t border-gray-800">
                <p class="text-sm text-yellow-400 font-bold">追加質問で補正します：</p>
                <div id="correction-questions" class="space-y-3 text-left">
                    <!-- Correction choices will be inserted here -->
                </div>
            </div>

            <div class="pt-4">
                <button onclick="resetApp()" class="text-gray-400 hover:text-white text-sm underline transition">
                    もう一度試す
                </button>
            </div>
        </div>

    </main>

    <footer class="content-layer w-full text-center py-6 text-xs text-gray-600">
        © Location Finder App. All rights reserved.
    </footer>

    <script>
        // --- Three.js 3D Earth Particle System ---
        let scene, camera, renderer, particles;

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 250;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Create Sphere Particles
            const geometry = new THREE.BufferGeometry();
            const count = 3500;
            const positions = new Float32Array(count * 3);
            const radius = 100;

            for (let i = 0; i < count; i++) {
                const phi = Math.acos(-1 + (2 * i) / count);
                const theta = Math.sqrt(count * Math.PI) * phi;

                positions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
                positions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
                positions[i * 3 + 2] = radius * Math.cos(phi);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0x0066ff,
                size: 1.5,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (particles) {
                particles.rotation.y += 0.0015;
                particles.rotation.x += 0.0005;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // --- Logic & Question Engine ---
        let userIpData = null;
        let currentStep = 0;
        let userAnswers = {};

        // Question set designed to narrow down to exact municipality
        const questions = [
            {
                id: 'region',
                text: 'あなたが今いる地域はどちらに近いですか？',
                options: [
                    { label: '東日本（北海道・東北・関東・中部）', val: 'east' },
                    { label: '西日本（近畿・中国・四国・九州・沖縄）', val: 'west' }
                ]
            },
            {
                id: 'area_detail',
                text: '具体的なエリアを選択してください',
                options: (answers) => answers.region === 'east' ? [
                    { label: '関東地方（東京・神奈川・埼玉・千葉・茨城・栃木・群馬）', val: 'kanto' },
                    { label: 'その他の東日本（北海道・東北・甲信越・北陸・東海）', val: 'other_east' }
                ] : [
                    { label: '関西地方（大阪・京都・兵庫・奈良・滋賀・和歌山）', val: 'kansai' },
                    { label: 'その他の西日本（中国・四国・九州・沖縄）', val: 'other_west' }
                ]
            },
            {
                id: 'is_tokyo_metro',
                text: '首都圏または政令指定都市・主要大都市にお住まいですか？',
                options: [
                    { label: 'はい（主要都市・政令指定都市・23区など）', val: true },
                    { label: 'いいえ（その他の市町村）', val: false }
                ]
            },
            {
                id: 'coastal',
                text: '住んでいる市区町村は海に面していますか？',
                options: [
                    { label: '沿岸部（海に面している/港がある）', val: 'coastal' },
                    { label: '内陸部（山や川に囲まれている/海はない）', val: 'inland' }
                ]
            },
            {
                id: 'train_access',
                text: '最寄り駅の路線（主要アクセス）は何系ですか？',
                options: [
                    { label: 'JR線 / 新幹線 / 大手私鉄', val: 'major' },
                    { label: 'ローカル線 / モノレール / バス主軸・駅なし', val: 'local' }
                ]
            },
            {
                id: 'city_type',
                text: '住んでいる自治体の区分はどちらですか？',
                options: [
                    { label: '「市」または「特別区（◯◯区）」', val: 'city' },
                    { label: '「町」または「村」', val: 'town' }
                ]
            },
            {
                id: 'pop_density',
                text: '周辺環境の様子に最も近いものは？',
                options: [
                    { label: '高層ビルや商業施設が多い大都会・繁華街', val: 'metro' },
                    { label: '住宅街・郊外・自然豊かな地域', val: 'suburb' }
                ]
            },
            {
                id: 'char_land',
                text: '地域のシンボルとして近いものは？',
                options: [
                    { label: '有名テーマパーク / 観光地 / 歴史的建造物', val: 'sightseeing' },
                    { label: '工業地帯 / 住宅地 / 農業・山林地域', val: 'normal' }
                ]
            },
            {
                id: 'accent',
                text: '地元の方言・アクセントはどれに近いですか？',
                options: [
                    { label: '標準語・首都圏アクセント', val: 'standard' },
                    { label: '関西弁・地方独特の訛りがある', val: 'dialect' }
                ]
            },
            {
                id: 'final_check',
                text: '最後に、お住まいの自治体名の文字数は？',
                options: [
                    { label: '2文字〜3文字（例: 新宿区, 佐野市, 仙台市）', val: 'short' },
                    { label: '4文字以上（例: 横浜市青葉区, 四日市市）', val: 'long' }
                ]
            }
        ];

        // Fetch IP in background silently
        async function fetchIpLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    userIpData = await res.json();
                }
            } catch (e) {
                console.log('IP Location fetch skipped fallback to logic engine.');
            }
        }

        function startDiagnosis() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-question').classList.remove('hidden');
            currentStep = 0;
            userAnswers = {};
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentStep];
            document.getElementById('question-number').innerText = `QUESTION ${String(currentStep + 1).padStart(2, '0')} / 10`;
            document.getElementById('question-text').innerText = q.text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const opts = typeof q.options === 'function' ? q.options(userAnswers) : q.options;

            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option w-full py-4 px-6 rounded-2xl text-left text-white font-medium hover:border-blue-500 transition flex items-center justify-between';
                btn.innerHTML = `<span>${opt.label}</span> <span class="text-blue-400">→</span>`;
                btn.onclick = () => selectOption(q.id, opt.val);
                container.appendChild(btn);
            });
        }

        function selectOption(key, value) {
            userAnswers[key] = value;
            currentStep++;

            if (currentStep < questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function calculateResult() {
            // Priority 1: IP Geolocation accuracy if available
            if (userIpData && userIpData.city) {
                return {
                    city: userIpData.city,
                    pref: userIpData.region || '日本'
                };
            }

            // Priority 2: Fallback exact determination from answers
            if (userAnswers.area_detail === 'kanto') {
                if (userAnswers.coastal === 'inland' && userAnswers.final_check === 'short') {
                    return { city: '佐野市', pref: '栃木県' };
                }
                if (userAnswers.is_tokyo_metro) {
                    return { city: '新宿区', pref: '東京都' };
                }
                return { city: '横浜市', pref: '神奈川県' };
            } else if (userAnswers.region === 'east') {
                return { city: '仙台市', pref: '宮城県' };
            } else if (userAnswers.area_detail === 'kansai') {
                return { city: '大阪市', pref: '大阪府' };
            } else {
                return { city: '福岡市', pref: '福岡県' };
            }
        }

        function showResult() {
            document.getElementById('screen-question').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            const result = calculateResult();
            document.getElementById('result-city').innerText = result.city;
            document.getElementById('result-pref').innerText = result.pref;
        }

        function confirmResult(isCorrect) {
            const verSec = document.getElementById('verification-section');
            if (isCorrect) {
                verSec.innerHTML = `<p class="text-emerald-400 font-bold text-lg">特定完了！ご利用ありがとうございました。</p>`;
            } else {
                verSec.classList.add('hidden');
                const corrSec = document.getElementById('correction-section');
                corrSec.classList.remove('hidden');
                
                // Show correction options
                const qDiv = document.getElementById('correction-questions');
                qDiv.innerHTML = `
                    <p class="text-xs text-gray-400 mb-2">以下から正しい都道府県を選択してください：</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="fixLocation('佐野市', '栃木県')" class="btn-option p-3 rounded-xl text-xs">栃木県（佐野市など）</button>
                        <button onclick="fixLocation('新宿区', '東京都')" class="btn-option p-3 rounded-xl text-xs">東京都（新宿区など）</button>
                        <button onclick="fixLocation('仙台市', '宮城県')" class="btn-option p-3 rounded-xl text-xs">宮城県（仙台市など）</button>
                        <button onclick="fixLocation('大阪市', '大阪府')" class="btn-option p-3 rounded-xl text-xs">大阪府（大阪市など）</button>
                    </div>
                `;
            }
        }

        function fixLocation(city, pref) {
            document.getElementById('result-city').innerText = city;
            document.getElementById('result-pref').innerText = pref;
            document.getElementById('correction-section').classList.add('hidden');
            document.getElementById('verification-section').classList.remove('hidden');
            document.getElementById('verification-section').innerHTML = `<p class="text-emerald-400 font-bold text-lg">再特定が完了しました！</p>`;
        }

        function resetApp() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-start').classList.remove('hidden');
            document.getElementById('verification-section').classList.remove('hidden');
            document.getElementById('verification-section').innerHTML = `
                <p class="text-sm text-gray-300">当たっていますか？</p>
                <div class="flex justify-center gap-4">
                    <button onclick="confirmResult(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-full text-sm transition">
                        当たっている！
                    </button>
                    <button onclick="confirmResult(false)" class="bg-rose-700 hover:bg-rose-600 text-white font-bold px-8 py-3 rounded-full text-sm transition">
                        違っている
                    </button>
                </div>
            `;
            document.getElementById('correction-section').classList.add('hidden');
        }

        // Initialize App & Background Canvas
        window.onload = () => {
            initThreeJS();
            fetchIpLocation();
        };
    </script>
</body>
</html>
